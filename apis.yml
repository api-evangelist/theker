name: Theker
description: 'Theker (THEKER Robotics) is a Barcelona-based robotics and artificial intelligence
  company whose stated mission is "solving 100% of physical work" — building humanoid and
  physical-AI systems it frames as "a power beyond human" and "the next frontier of robotics
  and intelligence." The company is at a stealth stage: its public site is a landing page and
  careers portal with product details deliberately withheld ("Details remain secured"). Its
  public GitHub organization (THEKER Robotics, Spain) works in the physical-AI/ROS 2 stack —
  forks of the ZED ROS 2 wrapper, NVIDIA cuRobo CUDA motion planning, and Meta SAM 3 perception.
  Backed by CRV. No public developer API, documentation, or SDK is published yet; this profile
  captures its identity and public surface pending a developer platform.'
